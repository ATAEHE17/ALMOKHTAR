<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>تسجيل الدخول — منصة التعليم</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="icon" type="image/png" href="almokhtar.png">
    <style>
        .login-page {
            overflow: hidden;
            background: url('login bg.jpg') center center / cover no-repeat fixed;
        }

        .login-page::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(60, 6, 10, .25) 0%, rgba(50, 5, 8, .55) 55%, rgba(35, 3, 6, .8) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .login-page .login-wrap {
            position: relative;
            z-index: 1;
            overflow: hidden;
            isolation: isolate;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px 20px 56px;
        }

        .login-card {
            position: relative;
            overflow: visible;
            margin-top: 0;
            background: rgba(30, 5, 8, .38);
            border: 1px solid rgba(255, 255, 255, .22);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
        }

        .login-page .field label {
            color: rgba(255, 255, 255, .82);
        }

        .login-page .input {
            background: rgba(0, 0, 0, .28);
            border: 1.5px solid rgba(255, 255, 255, .25);
            color: #fff;
        }

        .login-page .input::placeholder {
            color: rgba(255, 255, 255, .55);
        }

        .login-page .input:focus {
            border-color: rgba(255, 255, 255, .6);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, .12);
        }

        .login-page .btn-primary {
            background: #fff;
            color: #7A0D14;
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, .35);
        }

        .login-page .btn-primary:hover {
            filter: brightness(.97);
        }

        /* ---------- tablet / desktop: use the pre-composed wide image directly ---------- */
        @media (min-width: 700px) {
            .login-page {
                background: url('login-bg-wide.jpg') center / cover no-repeat fixed;
            }

            .login-page::before {
                background: none;
            }

            .login-card {
                background: rgba(20, 4, 7, .5);
            }

            .login-page .login-wrap {
                justify-content: center;
                align-items: flex-start;
                padding: 40px 8% 40px 0;
            }
        }

        .teacher-image {
            position: absolute;
            top: 27px;
            left: -2px;
            width: 140px;
            height: auto;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .25));
        }

        @media (max-width: 480px) {
            .teacher-image {
                width: 110px;
                top: -135px;
                left: -12px;
            }
        }

        .math-background {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .math-symbol {
            position: absolute;
            color: var(--accent-2);
            opacity: .48;
            font-family: Georgia, serif;
            font-size: clamp(26px, 5vw, 58px);
            font-weight: 700;
            filter: saturate(1.2) brightness(.82);
            animation: float-math 4s ease-in-out infinite;
        }

        .math-symbol:nth-child(1) {
            top: 7%;
            inset-inline-start: 6%;
            color: #F5A524;
            animation-delay: -2s;
        }

        .math-symbol:nth-child(2) {
            top: 12%;
            inset-inline-end: 8%;
            color: #22C55E;
            animation-delay: -7s;
        }

        .math-symbol:nth-child(3) {
            top: 31%;
            inset-inline-start: 4%;
            color: #38BDF8;
            animation-delay: -4s;
        }

        .math-symbol:nth-child(4) {
            top: 38%;
            inset-inline-end: 6%;
            color: #F0475A;
            animation-delay: -6s;
        }

        .math-symbol:nth-child(5) {
            top: 68%;
            inset-inline-start: 7%;
            color: #A78BFA;
            animation-delay: -3s;
        }

        .math-symbol:nth-child(6) {
            top: 73%;
            inset-inline-end: 8%;
            color: #14B8A6;
            animation-delay: -1s;
        }

        .math-symbol:nth-child(7) {
            bottom: 7%;
            inset-inline-start: 27%;
            color: #FB7185;
            animation-delay: -5s;
        }

        .math-symbol:nth-child(8) {
            bottom: 8%;
            inset-inline-end: 27%;
            color: #FACC15;
            animation-delay: -8s;
        }

        .math-symbol:nth-child(9) {
            top: 4%;
            inset-inline-start: 42%;
            color: #60A5FA;
            animation-delay: -1s;
        }

        .math-symbol:nth-child(10) {
            bottom: 3%;
            inset-inline-end: 44%;
            color: #34D399;
            animation-delay: -6s;
        }

        .math-symbol:nth-child(11) {
            top: 24%;
            inset-inline-start: 20%;
            color: #FB923C;
            animation-delay: -7s;
        }

        .math-symbol:nth-child(12) {
            top: 29%;
            inset-inline-end: 24%;
            color: #F472B6;
            animation-delay: -3s;
        }

        .math-symbol:nth-child(13) {
            bottom: 24%;
            inset-inline-start: 40%;
            color: #2DD4BF;
            animation-delay: -6s;
        }

        .math-symbol:nth-child(14) {
            bottom: 18%;
            inset-inline-end: 39%;
            color: #60A5FA;
            animation-delay: -2s;
        }

        .math-symbol:nth-child(15) {
            top: 55%;
            inset-inline-start: 20%;
            color: #A78BFA;
            animation-delay: -5s;
        }

        .math-symbol:nth-child(16) {
            top: 62%;
            inset-inline-end: 19%;
            color: #FACC15;
            animation-delay: -1s;
        }

        :root[data-theme="light"] .math-symbol {
            opacity: .58;
            filter: saturate(1.35) brightness(.7);
        }

        /* keep the floating math glyphs white against the red backdrop */
        .math-symbol {
            color: #fff !important;
            filter: none;
        }

        @keyframes float-math {

            0%,
            100% {
                transform: translate3d(0, 0, 0) rotate(-8deg);
            }

            50% {
                transform: translate3d(10px, -18px, 0) rotate(8deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .math-symbol {
                animation: none;
            }
        }



        .first-boy-image {
            position: absolute;
            top: 93px;
            left: 1px;
            width: 140px;
            height: auto;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .25));
        }

        @media (max-width: 480px) {
            .first-boy-image {
                width: 110px;
                top: -13589px;
                left: -12px;
            }
        }

        .second-boy-image {
            position: absolute;
            top: 9334px;
            left: 89px;
            width: 140px;
            height: auto;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .25));
        }

        @media (max-width: 480px) {
            .second-boy-image {
                width: 110px;
                top: 130px;
                left: -16px;
            }
        }

        .third-boy-image {
            position: absolute;
            top: 9334px;
            left: 89px;
            width: 140px;
            height: auto;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .25));
        }

        @media (max-width: 480px) {
            .third-boy-image {
                width: 110px;
                top: -27px;
                left: 190px;
            }
        }
    </style>

</head>

<body class="login-page">
    <div class="login-wrap">
        <div class="math-background" aria-hidden="true">
            <span class="math-symbol">+</span>
            <span class="math-symbol">&#x2211;</span>
            <span class="math-symbol">&#x221E;</span>
            <span class="math-symbol">&#x03C0;</span>
            <span class="math-symbol">&#x0394;</span>
            <span class="math-symbol">&#x221A;</span>
            <span class="math-symbol">&#x03B8;</span>
            <span class="math-symbol">&#x2248;</span>
            <span class="math-symbol">&#x03A3;</span>
            <span class="math-symbol">&#x222B;</span>
            <span class="math-symbol">&#x2202;</span>
            <span class="math-symbol">&#x03BB;</span>
            <span class="math-symbol">&#x03B1;</span>
            <span class="math-symbol">&#x03B2;</span>
            <span class="math-symbol">&#x03C6;</span>
            <span class="math-symbol">&#x03C9;</span>
        </div>
        <div class="login-card card">
            <img src="2boys.png" alt="الأستاذ المختار" class=" first-boy-image">
            <img src="second boy.png" alt="الأستاذ المختار" class="second-boy-image">



            <div class="hero">
                <div class="brand-logo" id="loginLogo">م</div>
                <h2>تسجيل الدخول للمنصة</h2>
            </div>

            <div class="field">
                <label>كود السنة الدراسية</label>
                <input type="text" id="classCode" class="input" placeholder="أدخل كود الصف">
            </div>

            <div class="field">
                <label>كلمة سر الطالب / الأدمن</label>
                <input type="password" id="userPassword" class="input" placeholder="أدخل كلمة السر">
            </div>

            <p class="err-text" id="loginErr"></p>
            <button class="btn btn-primary" onclick="handleLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script src="shared.js"></script>
    <script>
        window.whenMCReady(() => {
            window.applyTheme();
            const settings = window.getSettings();
            const logo = document.getElementById('loginLogo');
            if (settings && settings.logo) {
                logo.innerHTML = '<img src="' + settings.logo + '" alt="شعار المنصة">';
            }
        });

        function handleLogin() {
            const code = document.getElementById('classCode').value.trim();
            const pass = document.getElementById('userPassword').value.trim();
            const err = document.getElementById('loginErr');
            err.style.display = 'none';

            // يسمح للأدمن باستخدام خانة الكود وحدها.
            const settings = window.getSettings();
            if (!settings) {
                if ((code === 'admin123' && !pass) || (code === 'admin123' && pass === 'admmin123')) {
                    window.setSession({ role: 'admin' });
                    window.location.href = 'admin.html';
                    return;
                }
                err.textContent = 'انتظر لحظة حتى يكتمل تحميل المنصة.';
                err.style.display = 'block';
                return;
            }
            if (code === settings.adminPassword && !pass) {
                window.setSession({ role: 'admin' });
                window.location.href = 'admin.html';
                return;
            }

            if (!code || !pass) {
                err.textContent = 'يرجى إدخل جميع البيانات المطلوبة.';
                err.style.display = 'block';
                return;
            }

            if (pass === settings.adminPassword || (code === 'admin123' && pass === 'admmin123')) {
                window.setSession({ role: 'admin' });
                window.location.href = 'admin.html';
                return;
            }

            const matchedClass = settings.classes.find(c => c.code === code);
            if (!matchedClass) {
                err.textContent = 'كود السنة الدراسية غير صحيح.';
                err.style.display = 'block';
                return;
            }

            const student = window.getStudents().find(s => s.classId === matchedClass.id && s.password === pass);

            if (!student) {
                err.textContent = 'كلمة السر غير صحيحة أو الطالب غير مسجل.';
                err.style.display = 'block';
                return;
            }

            if (student.activeSessionId && student.activeSessionId !== window.getDeviceId()) {
                err.textContent = 'كلمة السر هذه مسجلة دخول بالفعل من جهاز آخر حالياً!';
                err.style.display = 'block';
                return;
            }

            const deviceId = window.getDeviceId();
            window.updateStudentSession(student.id, deviceId);
            window.setSession({ role: 'student', studentId: student.id, deviceId: deviceId });
            window.location.href = 'studenti.html';
        }
    </script>
</body>

</html>
